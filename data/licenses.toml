# nucl-parquet — data provenance & redistribution manifest
# =========================================================
# The repository LICENSE (MIT) covers nucl-parquet's CODE and the
# ENDF-6 -> Parquet *conversion* ONLY. The bundled evaluated nuclear data is
# THIRD-PARTY and is governed, per library, by the terms recorded below.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for attribution and for the
# generated artifacts. Do not hand-edit the generated files:
#
#   ATTRIBUTION.md            <- generated (only the AUTO section; prose is hand-written)
#   data/**/LICENSE.txt       <- generated per-dataset sidecars
#
#   regenerate:  python scripts/build_notices.py --write
#   verify:      python scripts/build_notices.py         (CI / pytest)
#
# NOTICE and COMPLIANCE.md are hand-written and are NOT touched by the
# generator — they carry prose (PR #245's non-commercial reframing) that no
# renderer will preserve faithfully.
#
# Verdicts come from a primary-source audit (2026-06-01); each `terms_url`
# was fetched directly. Entries added when the manifest gate landed
# (`audit_basis` field) record how their provenance was established from
# the corresponding builder in scripts/ or nucl_parquet/.
#
# `redistributable`:
#   true          - explicit permissive grant (CC-BY / US public domain / open)
#   "attribution" - redistributable with attribution; no formal open license,
#                   relying on open distribution + custodian intent
#   "conditional" - redistribution gated (e.g. commercial use needs clearance)
#   false         - NOT redistributable (must not be bundled)
# `risk`: green | amber | red.
#
# `paths` are repo-relative fnmatch globs. Every tracked data file must be
# claimed by at least one entry — enforced by scripts/build_notices.py and
# tests/test_licensing.py.

schema_version = 2

[manifest]
maintainer = "eXoma (Exotic Matter Applications), ETH Zürich"
audited = "2026-06-01"
extended = "2026-09-28"
note = "MIT applies to code + conversion, NOT to the data. See ATTRIBUTION.md."
usage = "non-commercial academic (eXoma / ETH Zürich). Custodian non-commercial / open-distribution grants cover this redistribution with acknowledgement; commercial users must obtain their own permission for IAEA- and JAEA-sourced libraries."

# The single copyright line stamped into every generated artifact. Held here
# rather than duplicated in each renderer so a copyright-holder change (the
# pending flip to "ETH Zürich" tracked in issue #239) is a one-field edit.
# Kept byte-identical to the current LICENSE header.
copyright = "Copyright (c) 2024-2026 eXoma"

# The one root scanned for coverage. Every bundled dataset lives under
# `data/<library>/`; `catalog.json` addresses each file with a data-dir-relative
# path (`tendl-2025/xs/`, not `data/tendl-2025/xs/`).
data_roots = ["data"]

# Files directly under `data/` that are project metadata (catalog, schema, this
# manifest, suppliers, builder-stamp exemptions) are MIT project files, not
# third-party data — excluded from coverage.
project_metadata = [
    "data/builder_stamp_exemptions.json",
    "data/catalog.json",
    "data/catalog.schema.json",
    "data/licenses.toml",
    "data/suppliers.json",
]

