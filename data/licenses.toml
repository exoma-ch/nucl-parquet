# ═══════════════════════════════════════════════════════════════════════════
# Code dependencies with licence obligations
# ═══════════════════════════════════════════════════════════════════════════
# Copyleft is triggered by DISTRIBUTION (GPL) or by NETWORK INTERACTION with a
# modified version (AGPL §13) — NOT by "commercial use". Data computed BY a
# copyleft program is not a derivative work of that program, so the outputs
# above ship freely; what must not happen is shipping, vendoring, or hard-
# depending on the copyleft code itself from an MIT-licensed distribution.

[code_dependencies.pycatima]
name = "pycatima / catima"
upstream = "https://github.com/hrosiak/catima"
spdx = "AGPL-3.0-only"
role = "build-time only — generates data/stopping/catima_*.parquet"
imported_by = ["nucl_parquet/build_heavy_ions.py"]
runtime_dependency = false
policy = "MUST NOT appear in [project].dependencies. The published wheel is MIT; a hard runtime dep would put an AGPL-3.0 library in every installing user's environment and contradict NOTICE. Keep it in the dev/build dependency group; the loader reads the pre-built Parquet shards and never imports it."
notes = "Upstream PyPI metadata declares no licence and the sdist ships no LICENSE file, but the catima repository is AGPL-3.0. Treat it as AGPL."

[code_dependencies.geant4]
name = "Geant4"
upstream = "https://geant4.web.cern.ch/download/license"
spdx = "LicenseRef-Geant4"
role = "build-time only — generated hi-xs-prod; upstream of the G4EMLOW / nuclear-structure tables"
imported_by = []
runtime_dependency = false
policy = "Not an OSI licence. No Geant4 source or binary is redistributed. The mandatory notice and the no-endorsement clause are carried in NOTICE."

