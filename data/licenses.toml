# ═══════════════════════════════════════════════════════════════════════════
# Geant4-derived (via the strata-data republication)
# ═══════════════════════════════════════════════════════════════════════════
# nucl-parquet ingests several tables that originate in the ASCII data files
# CERN ships with each Geant4 release (G4ENSDFSTATE, PhotonEvaporation,
# RadioactiveDecay, G4EMLOW). They reach us through `gerchowl/strata-data`,
# which parses those files and republishes Parquet (see
# scripts/fetch_strata_nuclear.py and nucl_parquet/build_em_stopping.py).
# The Geant4 Software License (NOT an OSI licence) governs those data files;
# its notice and no-endorsement requirements are mandatory and are carried in
# NOTICE.

[libraries.g4-nuclear]
name = "Geant4 nuclear-structure data (G4ENSDFSTATE, PhotonEvaporation, RadioactiveDecay)"
custodian = "Geant4 Collaboration (CERN); underlying evaluation ENSDF (NNDC/IAEA-NDS)"
terms_url = "https://geant4.web.cern.ch/download/license"
license = "Geant4 Software License v1.0 (NOT OSI) — notice + no-endorsement required"
redistributable = "attribution"
risk = "amber"
citation = "S. Agostinelli et al., 'Geant4 — a simulation toolkit', Nucl. Instrum. Meth. A 506 (2003) 250; underlying data: Evaluated Nuclear Structure Data File (ENSDF), NNDC, Brookhaven National Laboratory."
notes = "CORRECTION to the pre-manifest-gate [meta.decay] entry, which attributed these tables to ENSDF/NNDC alone. They are reformatted from Geant4's data files (G4ENSDFSTATE3.0, PhotonEvaporation6.1.2, RadioactiveDecay6.1.2), so the Geant4 notice applies in addition to the ENSDF citation."
audit_basis = "provenance established from scripts/fetch_strata_nuclear.py, which names G4ENSDFSTATE3.0 / PhotonEvaporation6.1.2 / RadioactiveDecay6.1.2 as the upstream files."
paths = [
    "data/meta/ensdf/**",
    "data/meta/decay.parquet",
    "data/meta/decay_detailed.parquet",
]

[libraries.g4-emlow]
name = "Geant4 G4EMLOW electron data (Seltzer-Berger brem DCS, electron stopping, density effect)"
custodian = "Geant4 Collaboration (CERN); underlying evaluation Seltzer & Berger (NIST) / ICRU-37"
terms_url = "https://geant4.web.cern.ch/download/license"
license = "Geant4 Software License v1.0 (NOT OSI) — notice + no-endorsement required"
redistributable = "attribution"
risk = "amber"
citation = "S.M. Seltzer, M.J. Berger, 'Bremsstrahlung energy spectra from electrons...', At. Data Nucl. Data Tables 35 (1986) 345; ICRU Report 37 (1984); Geant4: Agostinelli et al., Nucl. Instrum. Meth. A 506 (2003) 250."
notes = "NOTE: data/stopping/ESTAR.parquet is NO LONGER a NIST ESTAR scrape — since the strata migration it is rebuilt from Geant4 EM data under the legacy `source='ESTAR'` label for query compatibility. Attribute it to Geant4/ICRU-37, not to NIST SRD 124."
audit_basis = "provenance established from nucl_parquet/build_em_stopping.py and build_em_brem_dcs.py (both read gerchowl/strata-data em/*.parquet, which republishes G4EMLOW brem_SB.dat and Geant4 material tables). Confirmed: build_em_stopping.py writes ESTAR.parquet from strata's estar_long.parquet, not from a NIST scrape."
paths = [
    "data/em/electron_brem.parquet",
    "data/em/electron_brem_sb_dcs.parquet",
    "data/stopping/ESTAR.parquet",
    "data/stopping/em/**",
]

