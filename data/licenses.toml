# nucl-parquet — data provenance & redistribution manifest
# =========================================================
# The repository LICENSE (MIT) covers nucl-parquet's CODE and the
# ENDF-6 -> Parquet *conversion* ONLY. The bundled evaluated nuclear data is
# THIRD-PARTY and is governed, per library, by the terms recorded below.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for attribution and for the
# generated notices. Do not hand-edit the generated artifacts:
#
#   NOTICE                    <- generated (AUTO markers)
#   ATTRIBUTION.md            <- generated (AUTO markers)
#   data/**/LICENSE.txt       <- generated per-dataset sidecars
#   nucl_parquet/**/*.py      <- SPDX headers stamped from [eth]
#
#   regenerate:  python scripts/build_notices.py --write
#   verify:      python scripts/build_notices.py         (CI / pytest)
#
# Verdicts come from a primary-source audit (2026-06-01) extended on
# 2026-08-03; each `terms_url` in the 2026-06-01 set was fetched directly.
# Entries added on 2026-08-03 carry `audit_basis` recording how their
# provenance was established. `redistributable`:
#   true          - explicit permissive grant (CC-BY / US public domain / open)
#   "attribution" - redistributable with attribution; no formal open license,
#                   relying on open distribution + custodian intent (verify)
#   "conditional" - redistribution gated (e.g. commercial use needs clearance)
#   "unverified"  - bundled but provenance NOT established; must be resolved
#   false         - NOT redistributable (must not be bundled)
# `risk`: green | amber | red.
#
# `paths` are repo-relative fnmatch globs. Every tracked data file must be
# claimed by at least one entry — enforced by tests/test_licensing.py.

schema_version = 2

[manifest]
maintainer = "eXoma (Exotic Matter Applications), ETH Zürich"
audited = "2026-06-01"
extended = "2026-08-03"
note = "MIT applies to code + conversion, NOT to the data. See ATTRIBUTION.md."
usage = "non-commercial academic (eXoma / ETH Zürich). Custodian non-commercial / open-distribution grants cover this redistribution with acknowledgement; commercial users must obtain their own permission for IAEA- and JAEA-sourced libraries."

# Roots scanned for coverage. There is exactly one: every bundled dataset lives
# under `data/<library>/`, and `catalog.json` addresses it with data-dir-relative
# paths (`tendl-2025/xs/`, not `data/tendl-2025/xs/`) so a consumer can point
# $NUCL_PARQUET_DATA at any copy of the tree. Duplicate pre-refactor copies of
# `hi-xs-prod/` and `tendl-2025/` used to sit at the repository root; they were
# stale leftovers of the data->data/ move (a61afc9) and were deleted.
#
# Files directly under `data/` that are project metadata (catalog, schema, this
# manifest, suppliers) are MIT, not data.
data_roots = ["data"]
project_metadata = [
    "data/catalog.json",
    "data/catalog.schema.json",
    "data/licenses.toml",
    "data/suppliers.json",
]

# ═══════════════════════════════════════════════════════════════════════════
# ETH Zürich — institutional IP position (RSETHZ 440.4)
# ═══════════════════════════════════════════════════════════════════════════
# Reglement über Geistiges Eigentum und Verwertung von Forschungsergebnissen
# (IP- und Verwertungsreglement), in force since 1 July 2026. It replaced the
# 2014 "Richtlinien für die wirtschaftliche Verwertung von Forschungsergebnissen".
#
# Art. 5(3): ETH Zürich holds the exclusive economic exploitation rights in
# software created by its employees on duty; moral rights stay with the
# creators. The © notice below therefore names ETH Zürich as holder and the
# creators as creators — required verbatim by Art. 27(1)(e).

[eth]
regulation = "RSETHZ 440.4"
regulation_title = "Reglement über Geistiges Eigentum und Verwertung von Forschungsergebnissen (IP- und Verwertungsreglement)"
regulation_url = "https://ethz.ch/content/dam/ethz/main/eth-zurich/organisation/rechtssammlung/440.4.pdf"
in_force = "2026-07-01"
copyright_holder = "ETH Zürich"
copyright_years = "2024-2026"
# Art. 27(1)(e) — creators must be named alongside the ETH copyright notice.
creators = ["Lars Gerchow"]
research_group = "eXoma — Exotic Matter Applications"
# Art. 27(1)(a) — the OSS release decision belongs to the research group
# leader, not to the creators. Record it here when taken.
group_leader = "TBD — record the responsible Forschungsgruppenleiter:in"
oss_decision_date = "TBD"
oss_decision_recorded = false
spdx_license = "MIT"
spdx_copyright = "2024-2026 ETH Zürich (eXoma — Exotic Matter Applications)"
# Art. 27(3) — ETH staff may not sign CLAs for on-duty software without
# prior ETH transfer approval.
cla_policy = "prohibited-without-eth-transfer-approval"
# Art. 24 / Art. 34 — two-month disclosure duties to ETH transfer, triggered
# only by intended *commercial* exploitation. This project is non-commercial.
software_disclosure_required = false
data_disclosure_required = false
disclosure_note = "Art. 24 (software) and Art. 34 (research data/databases) require disclosure to ETH transfer at least two months before planned COMMERCIAL exploitation. nucl-parquet is non-commercial academic; no disclosure is due. If commercialisation is ever contemplated, both become due before any commitment."

