[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucl-parquet-mcp"
version = "0.11.0"
description = "MCP server for nuclear data — wraps nucl-parquet client library"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "nucl-parquet>=0.14.0",
    "duckdb>=1.5.5",
]

[project.scripts]
nucl-parquet-mcp = "nucl_parquet_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
