[package]
name = "nucl-parquet"
version = "0.16.1"
edition = "2021"
description = "Nuclear data as Parquet — zero-copy cross-section lookups for Monte Carlo transport"
license = "MIT"
repository = "https://github.com/exoma-ch/nucl-parquet"
keywords = ["nuclear", "physics", "parquet", "cross-section", "monte-carlo"]
categories = ["science", "data-structures"]

[features]
default = []
fetch = ["dep:reqwest", "dep:tar", "dep:zstd", "reqwest/rustls-tls"]
fetch-native-tls = ["fetch", "reqwest/native-tls"]

[dependencies]
parquet = { workspace = true }
arrow = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking"], optional = true }
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
