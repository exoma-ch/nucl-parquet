[package]
name = "nucl-parquet"
version = "0.11.0"
edition = "2021"
description = "Nuclear data as Parquet — zero-copy cross-section lookups for Monte Carlo transport"
license = "MIT"
repository = "https://github.com/exoma-ch/nucl-parquet"
keywords = ["nuclear", "physics", "parquet", "cross-section", "monte-carlo"]
categories = ["science", "data-structures"]

[features]
default = []
fetch = ["dep:reqwest", "dep:tar", "dep:zstd"]

[dependencies]
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
arrow = { version = "54", default-features = false, features = ["ffi"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "native-tls"], optional = true }
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
approx = "0.5"
