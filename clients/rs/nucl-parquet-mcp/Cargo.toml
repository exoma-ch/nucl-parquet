[package]
name = "nucl-parquet-mcp"
version = "0.14.1"
edition = "2021"
description = "MCP server for nuclear data — wraps local Parquet via nucl-parquet crate"
license = "MIT"
repository = "https://github.com/exoma-ch/nucl-parquet"

[[bin]]
name = "nucl-parquet-mcp"
path = "src/main.rs"

[dependencies]
# version is required for `cargo publish` (crates.io rejects path-only deps);
# path is used for local builds; `version` is required for crates.io, which
# refuses a path dependency without one. The two must therefore move together.
#
# This is maintained BY HAND. release-please cannot do it: `extra-files` paths
# are package-relative and reject `..`, so it cannot reach a sibling — and a bad
# path aborts the entire release-please run, not just this package. The durable
# fix is a cargo workspace plus the `cargo-workspace` plugin.
#
# tests/test_release_config.py fails if this drifts from the sibling's version.
nucl-parquet = { path = "../nucl-parquet", version = "0.15.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
