[package]
name = "nucl-parquet-mcp"
version = "0.14.1"
edition = "2021"
description = "MCP server for nuclear data — wraps local Parquet via nucl-parquet crate"
license = "MIT"
repository = "https://github.com/exoma-ch/nucl-parquet"

[[bin]]
name = "nucl-parquet-mcp"
path = "src/main.rs"

[dependencies]
# `version` is required for crates.io, which refuses a path dependency without
# one; `path` is what local builds use. release-please's `cargo-workspace`
# plugin keeps this in step with the sibling's version now that both are members
# of a real workspace (#307). tests/test_release_config.py still gates it, so a
# plugin that silently stops working is visible rather than discovered at
# release time.
nucl-parquet = { path = "../nucl-parquet", version = "0.16.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
