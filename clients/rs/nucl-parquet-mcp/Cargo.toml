[package]
name = "nucl-parquet-mcp"
version = "0.14.2"
edition = "2021"
description = "MCP server for nuclear data — wraps local Parquet via nucl-parquet crate"
license = "MIT"
repository = "https://github.com/exoma-ch/nucl-parquet"

[[bin]]
name = "nucl-parquet-mcp"
path = "src/main.rs"

[dependencies]
# `version` is required for crates.io, which refuses a path dependency without
# one; `path` is what local builds use. The two must move together.
#
# This is a MANUAL one-line edit on the release PR. Two attempts to automate it
# have both taken out release automation for the entire repo rather than just
# these crates: `extra-files` rejects the `..` needed to reach a sibling, and
# the `cargo-workspace` plugin resolves the workspace manifest at the repo root
# while this workspace lives at clients/rs/. Either failure aborts the whole
# release-please run.
#
# tests/test_release_config.py fails if this drifts, so the release PR says what
# to fix rather than surfacing a cargo resolution error.
nucl-parquet = { path = "../nucl-parquet", version = "0.17.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
