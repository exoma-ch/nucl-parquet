name: Release Data

# Data releases follow CalVer (YYYY.MM.MICRO) on their own tag namespace,
# decoupled from the code semver release pipeline (.github/workflows/release.yml).
# Triggers:
#   1. Tag push (manual `git push origin data-X.Y.Z`)
#   2. workflow_dispatch from auto-tag-data.yml (GITHUB_TOKEN tags don't
#      fire push events — this is the normal path after PR merge)

on:
  push:
    tags: ["data-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Data tag to release (e.g. data-2026.5.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Run the full CI test suite to verify clients work with the released data.
  verify:
    name: Verify clients
    uses: ./.github/workflows/ci.yml

  data-asset:
    name: Build & upload data tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Checkout tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Build tarball
        run: |
          # Tag form: data-YYYY.MM.MICRO → strip the `data-` prefix to get CalVer.
          # workflow_dispatch passes the tag via inputs.tag; push events via GITHUB_REF.
          if [ -n "${{ inputs.tag }}" ]; then
            CALVER="${{ inputs.tag }}"
            CALVER=${CALVER#data-}
          else
            CALVER=${GITHUB_REF#refs/tags/data-}
          fi
          # Sanity-check the tag actually matches CalVer.
          if ! [[ "${CALVER}" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: tag does not match data-YYYY.MM.MICRO (got CalVer='${CALVER}')" >&2
            exit 1
          fi
          # Sanity-check catalog.json::data_version matches the tag.
          CATALOG_VERSION=$(jq -r .data_version data/catalog.json)
          if [ "${CATALOG_VERSION}" != "${CALVER}" ]; then
            echo "ERROR: tag CalVer (${CALVER}) does not match data/catalog.json::data_version (${CATALOG_VERSION})" >&2
            exit 1
          fi
          tar --zstd -C data -cf "nucl-parquet-data-${CALVER}.tar.zst" .
          ls -lh "nucl-parquet-data-${CALVER}.tar.zst"
          echo "ASSET_PATH=nucl-parquet-data-${CALVER}.tar.zst" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The Hugging Face mirror is what catalog.json points browser consumers at for
  # lazy per-isotope fetches. It used to be maintained by hand, which is how it
  # came to publish ENDF/B-VIII.0 under `license: mit` — a grant nobody here can
  # make over a US Government work (#234). Generating the card from
  # data/licenses.toml on every release means the published licence cannot drift
  # from the compliance record again.
  huggingface-mirror:
    name: Sync Hugging Face mirror
    runs-on: ubuntu-latest
    needs: [verify, data-asset]
    # Forks have no business pushing to the mirror, so they skip. On the canonical
    # repo a missing token is a *failure*, not a skip: the card is what keeps the
    # published licence from drifting (#234), so "mirror silently did nothing"
    # must never be indistinguishable from "mirror is current". It reported green
    # for the whole of 2026.8.0 and 2026.8.1 while doing nothing at all.
    if: ${{ github.repository == 'exoma-ch/nucl-parquet' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: Sync dataset card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN is not set — the Hugging Face mirror cannot be" \
                 "updated, so its licence metadata will drift from data/licenses.toml." \
                 "Add HF_TOKEN (write scope on gerchowl/nucl-parquet-data) as a" \
                 "repository secret, or remove this job if the mirror is retired."
            exit 1
          fi
          # Card only. The shard upload is held back until the published
          # per-isotope layout and the local per-element layout are reconciled —
          # syncing today would interleave two incompatible shardings. The script
          # refuses that on its own; this keeps the release green in the meantime.
          uv run --with huggingface_hub python scripts/sync_huggingface.py --card-only
