name: Release Data

# Data releases follow CalVer (YYYY.MM.MICRO) on their own tag namespace,
# decoupled from the code semver release pipeline (.github/workflows/release.yml).
# Triggers:
#   1. Tag push. This is the normal path: auto-tag-data.yml pushes
#      `data-X.Y.Z` with a GitHub App installation token when a merge to main
#      changes `data/catalog.json::data_version`, and an App-token push (unlike
#      a GITHUB_TOKEN one) fires this trigger. A hand-pushed tag works the same
#      way. One operation, so there is no state where the tag exists and the
#      release was never asked for (#344).
#   2. workflow_dispatch — the recovery path, for a tag that exists with no
#      release behind it:
#        gh workflow run release-data.yml -f tag=data-X.Y.Z

on:
  push:
    tags: ["data-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Data tag to release (e.g. data-2026.5.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Run the full CI test suite to verify clients work with the released data.
  verify:
    name: Verify clients
    uses: ./.github/workflows/ci.yml

  data-asset:
    name: Build & upload data tarball
    runs-on: ubuntu-latest
    # Do not publish bytes the test suite has not passed (#291).
    #
    # This job used to run concurrently with `verify`, and it was not
    # theoretical: data-2026.8.2 published — signed — while `Verify clients`
    # was still in_progress. It passed, but by luck rather than by pipeline.
    #
    # Signing is what makes the gap matter. A digest says "these are the bytes";
    # a signature says "these bytes came from the nuclear-data team", and that
    # is a much weaker claim if the team's own suite never gated them. An
    # unverified signed release is worse than an unverified unsigned one,
    # because downstream now has a reason to trust it.
    #
    # The cost is real and deliberate: a flaky or infrastructure-broken CI run
    # now blocks a data release. That is the right trade for an artefact we
    # cryptographically vouch for — a red suite should stop a release, and if
    # the suite is too flaky to gate on, that is the defect to fix.
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - name: Install zstd + minisign
        run: sudo apt-get update && sudo apt-get install -y zstd minisign
      - name: Checkout tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Build tarball
        env:
          # Bound through the environment, not interpolated into the script
          # body. This step holds no secrets, but it runs in the same job as
          # the signing step and can write to $GITHUB_ENV — so an injection
          # here escalates: prepend a directory to PATH and the signing step
          # runs an attacker-supplied `minisign` with the key in its
          # environment. Data, never code (#289).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Tag form: data-YYYY.MM.MICRO → strip the `data-` prefix to get CalVer.
          # workflow_dispatch passes the tag via inputs.tag; push events via GITHUB_REF.
          if [ -n "${INPUT_TAG}" ]; then
            CALVER="${INPUT_TAG}"
            CALVER=${CALVER#data-}
          else
            CALVER=${GITHUB_REF#refs/tags/data-}
          fi
          # Sanity-check the tag actually matches CalVer.
          if ! [[ "${CALVER}" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: tag does not match data-YYYY.MM.MICRO (got CalVer='${CALVER}')" >&2
            exit 1
          fi
          # Sanity-check catalog.json::data_version matches the tag.
          CATALOG_VERSION=$(jq -r .data_version data/catalog.json)
          if [ "${CATALOG_VERSION}" != "${CALVER}" ]; then
            echo "ERROR: tag CalVer (${CALVER}) does not match data/catalog.json::data_version (${CATALOG_VERSION})" >&2
            exit 1
          fi
          # --exclude keeps the archive and the content manifest (#296) describing
          # the same set of files. `data/g4_raw/` is a gitignored build cache that
          # the manifest deliberately skips (_HASH_EXCLUDE_DIRS), but a bare
          # `tar -C data .` sweeps it in. A clean CI checkout does not have it, so
          # the mismatch is latent rather than absent — and a file that ships in
          # the tarball without a manifest entry is unverifiable, silently.
          tar --zstd -C data --exclude='./g4_raw' -cf "nucl-parquet-data-${CALVER}.tar.zst" .
          ls -lh "nucl-parquet-data-${CALVER}.tar.zst"
          echo "ASSET_PATH=nucl-parquet-data-${CALVER}.tar.zst" >> "$GITHUB_ENV"
          echo "CALVER=${CALVER}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v7

      # Build the content manifest (#296).
      #
      # The tarball signature proves the *archive bytes* are ours, and stops
      # being verifiable the moment anything legitimately rewrites the archive.
      # That is routine on the way into an isolated network: Content Disarm &
      # Reconstruction gateways open a .tar.zst, scan each entry and repack it,
      # so the data arrives intact and the signature does not survive
      # (exoma-ch/hyrr#614). A signed map of per-file digests survives a repack,
      # and lets a partial transfer be verified too — Debian's Release model.
      #
      # Built from the same tree walk as catalog.json::data_sha256, so the two
      # cannot disagree, but with the wider scope: the manifest covers every
      # file the tarball carries, including catalog.json and licenses.toml.
      # Those ride inside the archive and are the ones most worth tampering
      # with (#234 shipped a wrong licence claim on a published artefact).
      - name: Build content manifest
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${REF_NAME}}"
          TARBALL_SHA=$(sha256sum "${ASSET_PATH}" | cut -d' ' -f1)
          MANIFEST="nucl-parquet-data-${CALVER}.manifest.json"

          uv run --with zstandard python - "$TAG" "$TARBALL_SHA" "$MANIFEST" <<'PY'
          import sys
          sys.path.insert(0, ".")
          from nucl_parquet.download import build_release_manifest, dump_release_manifest

          tag, tarball_sha, out = sys.argv[1], sys.argv[2], sys.argv[3]
          manifest = build_release_manifest("data", tag=tag, tarball_sha256=tarball_sha)
          with open(out, "w", encoding="utf-8") as fh:
              fh.write(dump_release_manifest(manifest))
          print(f"manifest: {manifest['file_count']} files, data_version={manifest['data_version']}")
          PY

          # A manifest that lists nothing would sign and publish perfectly
          # happily while asserting nothing at all.
          COUNT=$(uv run python -c "import json,sys; print(json.load(open(sys.argv[1]))['file_count'])" "${MANIFEST}")
          if [ "${COUNT}" -lt 100 ]; then
            echo "::error::manifest lists only ${COUNT} files — refusing to sign an empty manifest"
            exit 1
          fi

          # The manifest must describe exactly what the archive carries. These
          # are built by different tools over different exclusion rules, so
          # asserting it here — rather than trusting that they agree — is what
          # stops a file shipping without a manifest entry, which is the one
          # failure this whole feature would not survive: unverifiable, and
          # invisible, because both artefacts are individually well-formed.
          tar --zstd -tf "${ASSET_PATH}" \
            | sed 's|^\./||' | grep -v '/$' | grep -v '^$' | LC_ALL=C sort > /tmp/tar_members.txt
          uv run python -c "
          import json, sys
          print('\n'.join(sorted(json.load(open(sys.argv[1]))['files'])))
          " "${MANIFEST}" | LC_ALL=C sort > /tmp/manifest_files.txt

          if ! diff -q /tmp/tar_members.txt /tmp/manifest_files.txt >/dev/null; then
            echo "::error::the tarball and the manifest describe different file sets."
            echo "In the tarball but NOT in the manifest (would be unverifiable):"
            comm -23 /tmp/tar_members.txt /tmp/manifest_files.txt | head -20
            echo "In the manifest but NOT in the tarball:"
            comm -13 /tmp/tar_members.txt /tmp/manifest_files.txt | head -20
            exit 1
          fi
          echo "manifest and tarball agree on ${COUNT} files"
          ls -lh "${MANIFEST}"
          echo "MANIFEST_PATH=${MANIFEST}" >> "$GITHUB_ENV"

      # Sign the tarball with the offline data-signing key (#289).
      #
      # A SHA-256 pin says "these are the bytes that build was tested against";
      # a signature says "these bytes came from the nuclear-data team". Only the
      # second survives re-pinning, because GitHub's published asset digest is
      # only as trustworthy as the account — and these releases are mutable.
      #
      # Signing is UNCONDITIONAL and hard-fails when the key is absent. The
      # alternative (skip quietly when the secret is missing) is the exact bug
      # #283 fixed for the HF mirror: a job that reports green while doing
      # nothing. An unsigned data release must be impossible, not merely
      # unusual — consumers that verify would break far more loudly downstream.
      - name: Sign tarball (minisign)
        env:
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
          DATA_SIGNING_KEY_PASSWORD: ${{ secrets.DATA_SIGNING_KEY_PASSWORD }}
          # Bound through the environment rather than interpolated into the
          # script body. `inputs.tag` is attacker-influenced (anyone who can
          # dispatch this workflow), and a `${{ }}` expansion is textual
          # substitution *before* bash parses the line — so a crafted tag would
          # execute shell in the one step that holds the signing key. As an env
          # var it is data, never code.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${DATA_SIGNING_KEY}" ] || [ -z "${DATA_SIGNING_KEY_PASSWORD}" ]; then
            echo "::error::Data releases must be signed (#289), but DATA_SIGNING_KEY and/or" \
                 "DATA_SIGNING_KEY_PASSWORD is not set. Generate the keypair offline with" \
                 "\`just gen-signing-key\` and set both repository secrets. See" \
                 "docs/security/data-signing.md. Refusing to publish an unsigned release."
            exit 1
          fi

          PUBKEY_FILE=docs/security/data-signing-key.pub
          if [ ! -f "${PUBKEY_FILE}" ]; then
            echo "::error::${PUBKEY_FILE} is missing. The public key consumers pin must be" \
                 "committed before a signed release can be published (#289)."
            exit 1
          fi

          # Keep key material out of the workspace entirely, so it can never be
          # swept into a release asset by a glob. RUNNER_TEMP is not archived.
          umask 077
          KEYFILE="${RUNNER_TEMP}/data-signing.key"
          printf '%s\n' "${DATA_SIGNING_KEY}" > "${KEYFILE}"
          trap 'shred -u "${KEYFILE}" 2>/dev/null || rm -f "${KEYFILE}"' EXIT

          TARBALL="${ASSET_PATH}"
          SHA256=$(sha256sum "${TARBALL}" | cut -d' ' -f1)
          TAG="${INPUT_TAG:-${REF_NAME}}"

          # The tag ends up inside the signed trusted comment, so constrain it
          # before signing: a signature is a durable assertion, and asserting
          # over unvalidated text is how a verifier gets fed something it will
          # happily parse as a different release.
          if ! [[ "${TAG}" =~ ^data-[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to sign for tag '${TAG}' — expected data-YYYY.MM.MICRO"
            exit 1
          fi

          # The trusted comment is covered by the signature, so binding version,
          # tag and digest into it makes the signature attest to *which release*
          # these bytes are — not merely that we signed some bytes. A verifier
          # that reads the trusted comment can detect a valid signature being
          # replayed onto a different release.
          TRUSTED_COMMENT="nucl-parquet data ${CALVER} tag=${TAG} sha256=${SHA256}"

          printf '%s\n' "${DATA_SIGNING_KEY_PASSWORD}" \
            | minisign -S -s "${KEYFILE}" -m "${TARBALL}" -t "${TRUSTED_COMMENT}"

          # Sign the manifest with the SAME key (#296). A second key would
          # double the rotation ceremony for no threat-model gain: both
          # artefacts assert the same thing from the same publisher.
          #
          # The manifest carries data_version and tag internally, and its
          # trusted comment repeats them. Belt and braces on purpose — the
          # internal fields survive the file being handed around without its
          # signature, and the trusted comment is what a verifier can trust
          # before it has decided to trust the file's contents.
          MANIFEST_SHA=$(sha256sum "${MANIFEST_PATH}" | cut -d' ' -f1)
          printf '%s\n' "${DATA_SIGNING_KEY_PASSWORD}" \
            | minisign -S -s "${KEYFILE}" -m "${MANIFEST_PATH}" \
              -t "nucl-parquet manifest ${CALVER} tag=${TAG} sha256=${MANIFEST_SHA}"

          # Verify against the *committed* public key — the one consumers pin.
          # This is what catches a rotated-but-not-committed key, a corrupted
          # secret, or a swapped signing identity: the release fails here
          # instead of shipping a signature no consumer can verify.
          # `|| true` so a comment-only key file reports the diagnosis below
          # rather than aborting the assignment under `set -o pipefail`.
          PUBKEY=$( { grep -v '^untrusted comment:' "${PUBKEY_FILE}" || true; } | tr -d '[:space:]')
          if [ -z "${PUBKEY}" ]; then
            echo "::error::${PUBKEY_FILE} contains no key line."
            exit 1
          fi
          for artefact in "${TARBALL}" "${MANIFEST_PATH}"; do
            if ! minisign -V -P "${PUBKEY}" -m "${artefact}"; then
              echo "::error::The signature for ${artefact} does not verify against ${PUBKEY_FILE}." \
                   "The DATA_SIGNING_KEY secret and the committed public key have diverged." \
                   "Follow the rotation runbook in docs/security/data-signing.md."
              exit 1
            fi
            # Cheaper than reasoning about whether action-gh-release treats an
            # empty line in its `files:` list as unmatched: if a signature is
            # not on disk here, fail now rather than publish an artefact alone.
            [ -f "${artefact}.minisig" ] || {
              echo "::error::expected ${artefact}.minisig to exist after signing"
              exit 1
            }
          done

          echo "SIG_PATH=${TARBALL}.minisig" >> "$GITHUB_ENV"
          echo "MANIFEST_SIG_PATH=${MANIFEST_PATH}.minisig" >> "$GITHUB_ENV"
          echo "Signed ${TARBALL} (sha256=${SHA256})"
          echo "Signed ${MANIFEST_PATH} (sha256=${MANIFEST_SHA})"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.SIG_PATH }}
            ${{ env.MANIFEST_PATH }}
            ${{ env.MANIFEST_SIG_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The Hugging Face mirror is what catalog.json points browser consumers at for
  # lazy per-isotope fetches. It used to be maintained by hand, which is how it
  # came to publish ENDF/B-VIII.0 under `license: mit` — a grant nobody here can
  # make over a US Government work (#234). Generating the card from
  # data/licenses.toml on every release means the published licence cannot drift
  # from the compliance record again.
  huggingface-mirror:
    name: Sync Hugging Face mirror
    runs-on: ubuntu-latest
    needs: [verify, data-asset]
    # Whether the mirror is maintained is a *declared* state, not something to
    # infer from whether a secret happens to exist.
    #
    #   vars.HF_MIRROR_ENABLED unset  -> job is skipped. Grey, and honestly so.
    #   set to 'true', token missing  -> job fails loudly (see below).
    #   set to 'true', token present  -> card is pushed.
    #
    # The bug this replaces: the job keyed off the secret and warn-and-skipped
    # when it was absent, so it reported *success* through 2026.8.0 and 2026.8.1
    # while pushing nothing. The card is what keeps the published licence from
    # drifting (#234), so "mirror silently did nothing" must never be
    # indistinguishable from "mirror is current". Skipped says that; green lies.
    if: ${{ github.repository == 'exoma-ch/nucl-parquet' && vars.HF_MIRROR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@v7
      - name: Sync shards + dataset card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_MIRROR_ENABLED is 'true' but HF_TOKEN is not set." \
                 "The mirror's licence metadata will drift from data/licenses.toml" \
                 "(#234). Add HF_TOKEN with write scope on gerchowl/nucl-parquet-data," \
                 "or unset HF_MIRROR_ENABLED to retire the mirror deliberately."
            exit 1
          fi
          # Shards are split per isotope on upload so the mirror keeps the
          # `n_Nd143.parquet` names it already serves, while carrying the
          # repository's current canonical schema. The card is pushed after the
          # shards, and describes them.
          uv run --with huggingface_hub --with polars python scripts/sync_huggingface.py
