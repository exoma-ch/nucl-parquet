name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# release-please-action@v4 hadn't shipped a Node 24 release as of 2026-05.
# Opt-in early via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 so we surface any
# breakage now rather than at the Jun 2 2026 forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # PAT (or GitHub App token) is required so the tag push triggers
          # release.yml. GITHUB_TOKEN-pushed tags are silently ignored by
          # workflow triggers (GitHub security feature) — see #35 / #57 for
          # the history. Falls back to GITHUB_TOKEN if the secret is unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
