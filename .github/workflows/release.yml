name: Release

# Per-package code release pipeline. Each tag prefix routes to exactly one
# publish job; an MCP-only fix no longer pushes a no-op release on the core
# packages. See release-please-config.json for the package-to-tag mapping.
#
# Data tarballs ship from a separate workflow (release-data.yml) on
# `data-YYYY.MM.DD` CalVer tags. Data and code release independently.

on:
  push:
    tags:
      - "nucl-parquet-py-v*"
      - "nucl-parquet-mcp-py-v*"
      - "nucl-parquet-rs-v*"
      - "nucl-parquet-mcp-rs-v*"
      - "nucl-parquet-ts-v*"
      - "nucl-parquet-mcp-ts-v*"
      - "clients/go/nucl-parquet/v*"

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    name: Publish nucl-parquet to PyPI
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-py-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-mcp:
    name: Publish nucl-parquet-mcp to PyPI
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-mcp-py-v')
    runs-on: ubuntu-latest
    environment: pypi-mcp
    defaults:
      run:
        working-directory: clients/py/nucl-parquet-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/py/nucl-parquet-mcp/dist

  cargo:
    name: Publish nucl-parquet to crates.io
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-rs-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rs/nucl-parquet
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  cargo-mcp:
    name: Publish nucl-parquet-mcp to crates.io
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-mcp-rs-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rs/nucl-parquet-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Wait for the sibling crate to be on crates.io before publishing (#309).
      #
      # release-please tags every component in the same instant, and this
      # workflow is tag-triggered, so the two rust publishes run as independent
      # concurrent runs with no ordering between them — `needs:` orders jobs
      # within a run, not runs with different triggers.
      #
      # `cargo publish` resolves this crate's `nucl-parquet` dependency against
      # the *registry*, not the path, so the dependency must already be indexed.
      # Whichever run gets there first wins, and roughly half the time that is
      # this one, which then fails with:
      #
      #   failed to select a version for the requirement `nucl-parquet = "^0.16.0"`
      #
      # A re-run fixes it, which is exactly why it would keep being read as flake.
      - name: Wait for nucl-parquet to be published
        run: |
          set -euo pipefail
          NEED=$(grep -oP 'version = "\K[^"]+' <<< "$(grep '^nucl-parquet = ' Cargo.toml)")
          [ -n "${NEED}" ] || { echo "::error::could not read the required nucl-parquet version"; exit 1; }
          echo "waiting for nucl-parquet ${NEED} on crates.io"
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: nucl-parquet-release (+https://github.com/exoma-ch/nucl-parquet)' \
              "https://crates.io/api/v1/crates/nucl-parquet/${NEED}" 2>/dev/null || echo 000)
            if [ "${code}" = "200" ]; then
              echo "nucl-parquet ${NEED} is available (attempt ${attempt})"
              exit 0
            fi
            sleep 10
          done
          echo "::error::nucl-parquet ${NEED} did not appear on crates.io within 10 minutes." \
               "If its own publish job failed, fix that first — this crate cannot publish without it."
          exit 1

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish @nucl-parquet/core to npm
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-ts-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/ts/nucl-parquet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing (no NPM_TOKEN). Node 24 bundles npm 11.x; the
      # explicit upgrade guards the >= 11.5.1 floor that trusted publishing
      # needs regardless of the runner's bundled version. The package must have
      # a trusted publisher configured on npmjs.com pointing at this repo +
      # workflow + `npm` environment. Provenance is emitted automatically.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  npm-mcp:
    name: Publish @nucl-parquet/mcp to npm
    if: startsWith(github.ref, 'refs/tags/nucl-parquet-mcp-ts-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/ts/nucl-parquet-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing (no NPM_TOKEN). Node 24 bundles npm 11.x; the
      # explicit upgrade guards the >= 11.5.1 floor that trusted publishing
      # needs regardless of the runner's bundled version. The package must have
      # a trusted publisher configured on npmjs.com pointing at this repo +
      # workflow + `npm` environment. Provenance is emitted automatically.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  # Go does not need a publish job: release-please tags `clients/go/nucl-parquet/v*`
  # directly, which is the form the Go module proxy resolves. The tag's
  # existence on GitHub *is* the publish. We keep a noop step on the Go tag
  # purely so the workflow run shows up in the release record.
  go-noop:
    name: Acknowledge Go module tag
    if: startsWith(github.ref, 'refs/tags/clients/go/nucl-parquet/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Go module tag $GITHUB_REF pushed; Go module proxy resolves it directly."
