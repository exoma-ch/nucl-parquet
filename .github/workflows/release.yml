name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  data-asset:
    name: Build & upload data tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          tar --zstd -C data -cf "nucl-parquet-data-v${VERSION}.tar.zst" .
          ls -lh "nucl-parquet-data-v${VERSION}.tar.zst"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: nucl-parquet-data-v*.tar.zst
          fail_on_unmatched_files: true

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/ts/nucl-parquet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cargo:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rs/nucl-parquet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  go-tag:
    name: Mirror Go module tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Go module tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${GITHUB_REF#refs/tags/v}
          git tag -a "go/nucl-parquet/v${VERSION}" -m "Go v${VERSION}"
          git push origin "go/nucl-parquet/v${VERSION}"
