name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Single nix-driven job. It installs Nix, runs `nix flake check` (fast lint), then
# the full suite via `nix develop -c ./scripts/ci.sh` — the SAME command developers
# run locally, so CI and local are byte-for-byte identical (uv/rust/node/go/ruff +
# native libs all pinned by flake.nix). Replaces the previous 5 hand-maintained jobs.
#
# The job name is kept as "prek hooks" because the main-branch ruleset requires that
# exact status-check context; renaming it would need a coordinated ruleset update.
jobs:
  ci:
    name: prek hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-update-lock-file
      - run: nix develop --command ./scripts/ci.sh
