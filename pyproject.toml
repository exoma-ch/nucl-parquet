[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucl-parquet"
version = "0.17.3"
description = "Nuclear data as Parquet — queryable with DuckDB"
readme = "README.md"
license = "MIT"
# Art. 27(1)(e) RSETHZ 440.4: the distributed artifact must carry the licence
# and the ETH copyright notice, not just the git repository.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lars Gerchow" }]
maintainers = [{ name = "eXoma (Exotic Matter Applications), ETH Zürich" }]
requires-python = ">=3.11"
# Runtime deps must stay permissively licensed: the wheel is MIT, and a copyleft
# runtime dep would be incompatible under RSETHZ 440.4 Art. 27(1)(c).
# pycatima (AGPL-3.0) is deliberately NOT here — see the `build` extra.
dependencies = [
    "duckdb>=1.5.0",
    "numpy>=1.24",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["polars>=1.0", "pytest>=8.0", "requests>=2.31"]
# pycatima wraps catima, which is AGPL-3.0. It is needed ONLY to regenerate
# data/stopping/catima_*.parquet via `python -m nucl_parquet.build_heavy_ions`;
# the loader reads the pre-built shards and never imports it. Keeping it out of
# [project].dependencies stops `pip install nucl-parquet` from pulling an
# AGPL-3.0 library into every user's environment. See data/licenses.toml
# [code_dependencies.pycatima] and COMPLIANCE.md §3.
build = ["pycatima>=1.981"]

[dependency-groups]
dev = [
    "endf>=0.1.12",
    "h5py>=3.10",
    "huggingface-hub>=0.30",
    "jsonschema>=4.0",
    "polars>=1.0",
    # AGPL-3.0 — build-time only, never a runtime dep. See [project.optional-dependencies].build
    "pycatima>=1.981",
    "pytest>=8.0",
    "requests>=2.31",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/exoma-ch/nucl-parquet"
Repository = "https://github.com/exoma-ch/nucl-parquet"

[tool.setuptools.packages.find]
include = ["nucl_parquet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: requires parquet data files",
    "network: requires network access (e.g., HuggingFace download)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
