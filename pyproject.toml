[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucl-parquet"
version = "0.18.0"
description = "Nuclear data as Parquet — queryable with DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.0",
    "numpy>=1.24",
    "pycatima>=1.981",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["polars>=1.0", "pytest>=8.0", "requests>=2.31"]

[dependency-groups]
dev = [
    "endf>=0.1.12",
    "h5py>=3.10",
    "huggingface-hub>=0.30",
    "jsonschema>=4.0",
    # scripts/fetch_stsv.py parses Fedlex's Akoma Ntoso XML (#294).
    "lxml>=5.0",
    "polars>=1.0",
    "pytest>=8.0",
    # tests/test_data_signing.py parses the release workflow. Available
    # transitively today (via huggingface-hub), declared here because the
    # signing gates must not break when a transitive dep drops it.
    "pyyaml>=6.0",
    "requests>=2.31",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/exoma-ch/nucl-parquet"
Repository = "https://github.com/exoma-ch/nucl-parquet"

[tool.setuptools.packages.find]
include = ["nucl_parquet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: requires parquet data files",
    "network: requires network access (e.g., HuggingFace download)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
